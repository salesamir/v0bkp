[probe]
#with Long Klicky Probe
pin: ^PA3
x_offset: 8                  #(9.5 with front cowling)
y_offset: 0
z_offset: 14.5                #valor de partida, recalibrar com PROBE_CALIBRATE
speed: 7
lift_speed: 7

samples: 3
samples_result: median
sample_retract_dist: 2

samples_tolerance: 0.01
samples_tolerance_retries: 10

[bed_mesh]
mesh_min: 15,15
mesh_max: 105,105
speed: 100
horizontal_move_z: 20

probe_count: 3,3
relative_reference_index: 4
move_check_distance: 3

algorithm: lagrange
fade_start: 1
fade_end: 10
fade_target: 0
split_delta_z: 0.0125
mesh_pps: 2,2

[screws_tilt_adjust]
screw1: 100,115
screw1_name: back right
screw2: 0,115
screw2_name: back left
screw3: 60,5
screw3_name: front screw
horizontal_move_z: 20
speed: 100
screw_thread: CW-M3
